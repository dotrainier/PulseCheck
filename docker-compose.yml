services:
    app:
        build: .
        env_file: .env.docker
        volumes:
            - app_public:/app/public
        depends_on:
            - postgres

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - app_public:/app/public:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    queue:
        build: .
        env_file: .env.docker
        command: php artisan queue:work --tries=3 --timeout=60
        depends_on:
            - postgres

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: pulsecheck
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 123456
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    app_public:
    postgres_data:
