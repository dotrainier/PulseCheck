services:
    app:
        build: .
        environment:
            APP_KEY: ${APP_KEY}
            APP_ENV: ${APP_ENV:-production}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-pulsecheck}
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
            CACHE_STORE: ${CACHE_STORE:-database}
            SESSION_DRIVER: ${SESSION_DRIVER:-database}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PulseCheck}
        volumes:
            - app_public:/app/public
            - app_storage:/app/storage
        depends_on:
            - postgres

    nginx:
        image: nginx:alpine
        volumes:
            - app_public:/app/public:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.pulsecheck.rule=Host(`${APP_DOMAIN}`)"
            - "traefik.http.routers.pulsecheck.entrypoints=https"
            - "traefik.http.routers.pulsecheck.tls.certresolver=letsencrypt"
            - "traefik.http.services.pulsecheck.loadbalancer.server.port=80"

    queue:
        build: .
        entrypoint: []
        command: php artisan queue:work --tries=3 --timeout=60
        environment:
            APP_KEY: ${APP_KEY}
            APP_ENV: ${APP_ENV:-production}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-pulsecheck}
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
            CACHE_STORE: ${CACHE_STORE:-database}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PulseCheck}
        volumes:
            - app_storage:/app/storage
        depends_on:
            - postgres

    scheduler:
        build: .
        entrypoint: []
        command: php artisan schedule:work
        environment:
            APP_KEY: ${APP_KEY}
            APP_ENV: ${APP_ENV:-production}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-pulsecheck}
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
            CACHE_STORE: ${CACHE_STORE:-database}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PulseCheck}
        volumes:
            - app_storage:/app/storage
        depends_on:
            - postgres

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_DATABASE:-pulsecheck}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    app_public:
    app_storage:
    postgres_data:
