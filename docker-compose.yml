services:
    postgres:
        image: postgres:16
        ports:
            - "127.0.0.1:5432:5432"
        restart: unless-stopped
        environment:
            POSTGRES_DB: pulsecheck
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d pulsecheck"]
            interval: 5s
            retries: 10

    app:
        build: .
        restart: unless-stopped
        env_file: .env
        volumes:
            - app_public:/app/public
            - app_storage:/app/storage
        depends_on:
            postgres:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - app_public:/app/public:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - app

    queue:
        build: .
        restart: unless-stopped
        env_file: .env
        entrypoint: []
        command: php artisan queue:work --tries=3 --timeout=60
        volumes:
            - app_storage:/app/storage
        depends_on:
            postgres:
                condition: service_healthy
            app:
                condition: service_started

    scheduler:
        build: .
        restart: unless-stopped
        env_file: .env
        entrypoint: []
        command: php artisan schedule:work
        volumes:
            - app_storage:/app/storage
        depends_on:
            postgres:
                condition: service_healthy
            app:
                condition: service_started

volumes:
    app_public:
    app_storage:
    postgres_data:
